<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Hexagonal frame -->
  <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="#111827" stroke="#2563EB" stroke-width="1.5"/>
  <!-- Inner ring -->
  <polygon points="16,7 23,11 23,21 16,25 9,21 9,11" fill="none" stroke="rgba(59,130,246,0.3)" stroke-width="0.8"/>
  <!-- CV lens -->
  <circle cx="16" cy="16" r="4" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
  <!-- Aperture center dot — safety red -->
  <circle cx="16" cy="16" r="1.8" fill="#EF4444"/>
  <!-- Crosshair lines -->
  <line x1="16" y1="5"  x2="16" y2="10" stroke="#3B82F6" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="22" x2="16" y2="27" stroke="#3B82F6" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="5"  y1="16" x2="10" y2="16" stroke="#3B82F6" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="22" y1="16" x2="27" y2="16" stroke="#3B82F6" stroke-width="1.2" stroke-linecap="round"/>
</svg>
